<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>List an Item | ReUseLoop</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .listing-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        }

        .listing-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .listing-container .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .listing-form label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .listing-form input,
        .listing-form textarea,
        .listing-form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .listing-form textarea {
            min-height: 110px;
            resize: vertical;
        }

        .listing-form button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #218838;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .listing-form button:hover {
            background: #17692b;
        }

        #photo-preview {
            display: none;
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 12px;
            border-radius: 8px;
            background: #f5f5f5;
        }

        #form-message {
            margin-top: 18px;
            text-align: center;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <header>
        <h2>ReUseLoop</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="pages/browse.html">Browse Items</a>
            <a href="add-item.html">List an Item</a>
        </nav>
    </header>

    <main class="listing-container">

        <h1>List Your Item</h1>

        <p class="subtitle">
            Give your unused items a new life!
        </p>

        <form id="add-item-form" class="listing-form">

            <label for="title">Item Name *</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="Example: Used Laptop"
                required
            >

            <label for="description">Description *</label>
            <textarea
                id="description"
                name="description"
                placeholder="Describe your item..."
                required
            ></textarea>

            <label for="category_id">Category *</label>
            <select id="category_id" name="category_id" required>
                <option value="">Select a category</option>
                <option value="1">Electronics</option>
                <option value="2">Books</option>
                <option value="3">Clothing</option>
                <option value="4">Furniture</option>
                <option value="5">Home Appliances</option>
                <option value="6">Sports</option>
                <option value="7">Other</option>
            </select>

            <label for="item_condition">Item Condition *</label>
            <select id="item_condition" name="item_condition" required>
                <option value="">Select condition</option>
                <option value="New">New</option>
                <option value="Like New">Like New</option>
                <option value="Good">Good</option>
                <option value="Fair">Fair</option>
            </select>

            <label for="listing_type">Listing Type *</label>
            <select id="listing_type" name="listing_type" required>
                <option value="">Select listing type</option>
                <option value="Sale">For Sale</option>
                <option value="Exchange">Exchange</option>
                <option value="Donation">Donation</option>
            </select>

            <label for="price">Price (₹)</label>
            <input
                type="number"
                id="price"
                name="price"
                min="0"
                step="0.01"
                value="0"
            >

            <label for="city">City *</label>
            <input
                type="text"
                id="city"
                name="city"
                placeholder="Example: Mysuru"
                required
            >

            <label for="photo">Item Photo</label>
            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/*"
            >

            <img id="photo-preview" alt="Selected item photo preview">

            <button type="submit" id="submit-item">
                Submit Listing
            </button>

            <p id="form-message" role="status"></p>

            <div class="form-group">
    <label for="contact_email">Contact Email Address</label>

    <input
        type="email"
        id="contact_email"
        name="contact_email"
        placeholder="Enter your email address"
        required
    >

    <small>
        Buyers can use this email to contact you about your item.
    </small>
</div>

        </form>
    </main>

    <script src="js/add-item.js"></script>

</body>
</html>
