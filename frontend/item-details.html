<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details | ReUseLoop</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f5f8f5;
            color: #20352a;
            font-family: Arial, sans-serif;
        }

        .details-container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #27834b;
            text-decoration: none;
            font-weight: 600;
        }

        .details-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            background: white;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.07);
        }

        .image-box {
            min-height: 380px;
            background: #edf3ed;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            min-height: 380px;
            max-height: 500px;
            object-fit: cover;
        }

        .image-placeholder {
            font-size: 75px;
            color: #8aa995;
        }

        .item-info { padding: 12px 5px; }

        .item-type {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 20px;
            background: #e5f5e9;
            color: #247744;
            font-size: 13px;
            font-weight: bold;
        }

        .item-info h1 {
            font-size: 32px;
            margin: 18px 0 12px;
        }

        .price {
            color: #25834a;
            font-size: 27px;
            font-weight: bold;
            margin: 15px 0;
        }

        .description {
            color: #65756b;
            line-height: 1.7;
            margin: 20px 0;
            white-space: pre-wrap;
        }

        .info-list {
            border-top: 1px solid #e7eee8;
            margin-top: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid #e7eee8;
        }

        .info-row span:first-child { color: #718076; }
        .info-row span:last-child {
            font-weight: 600;
            text-align: right;
        }

        .contact-button {
            display: inline-block;
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #27834b;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .contact-button:hover { background: #1d693b; }

        .status-message {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: #65756b;
        }

        @media(max-width: 750px) {
            .details-card { grid-template-columns: 1fr; padding: 16px; }
            .image-box, .image-box img { min-height: 260px; }
            .item-info h1 { font-size: 26px; }
        }
    </style>
</head>

<body>
    <header id="site-header"></header>

    <main class="details-container">
        <a href="/pages/browse.html" class="back-link">← Back to Browse Items</a>

        <div id="details-content">
            <div class="status-message">Loading item details...</div>
        </div>
    </main>

    <script src="/js/navigation.js"></script>
    <script src="/js/item-details.js"></script>
</body>
</html>
